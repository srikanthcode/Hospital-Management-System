services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: hospital
      PGPASSWORD: hospital
      PGDATABASE: hospital_db
      PGSSLMODE: disable
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hospital
      POSTGRES_PASSWORD: hospital
      POSTGRES_DB: hospital_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./hospital_management/install/full_database.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital -d hospital_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  pgdata:
